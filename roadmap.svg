  <g font-family="Arial" font-size="14" fill="#fff" text-anchor="middle">
    <rect x="20" y="80" width="120" height="70" rx="8" fill="#1f3a5f"/><text x="80" y="110">Weeks 1-3</text><text x="80" y="132">DSA</text>
    <rect x="160" y="80" width="120" height="70" rx="8" fill="#2f5d9e"/><text x="220" y="110">Week 4</text><text x="220" y="132">OS</text>
